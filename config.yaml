# config.yaml
# Selector de proveedor LLM: cambiar "active_provider" (o usar la sidebar de la app,
# que guarda la selección aquí mismo) NO requiere tocar código en ningún caso.
# Para agregar un proveedor nuevo compatible con la API de OpenAI, basta con
# añadir un bloque más abajo con la misma forma.
#
# Desde la Fase 3 del plan, ningún LLM "ve" la imagen del trazado: el informe
# clínico se genera a partir del dict de `clinical.py` (texto estructurado), así
# que "text_models" es lo que usa la app para el informe. "vision_models" queda
# documentado por si en el futuro se vuelve a necesitar un modelo de visión.
active_provider: "openrouter"

providers:
  ollama:
    label: "Ollama (Local / Hospital)"
    base_url: "http://localhost:11434/v1"
    model: "qwen2.5vl"
    needs_api_key: false
    api_key_env: null
    text_models:
      - "qwen2.5vl"
      - "llava"
    vision_models:
      - "qwen2.5vl"
      - "llava"

  openrouter:
    label: "OpenRouter (Nube)"
    base_url: "https://openrouter.ai/api/v1"
    model: "google/gemma-4-31b-it:free"
    needs_api_key: true
    api_key_env: "OPENROUTER_API_KEY"
    text_models:
      # --- gratis, para probar el MVP sin costo (con límite de uso de OpenRouter) ---
      - "google/gemma-4-31b-it:free"
      - "google/gemma-4-26b-a4b-it:free"
      - "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free"
      # --- de pago, para cuando se necesite más calidad/consistencia ---
      - "anthropic/claude-sonnet-4.5"
      - "google/gemini-2.5-flash"
      - "anthropic/claude-opus-5"
      - "google/gemini-3.1-pro-preview"
    vision_models:
      - "google/gemma-4-31b-it:free"
      - "google/gemma-4-26b-a4b-it:free"
      - "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free"
      - "anthropic/claude-sonnet-4.5"
      - "google/gemini-2.5-flash"
      - "anthropic/claude-opus-5"
      - "google/gemini-3.1-pro-preview"

  huggingface:
    label: "Hugging Face (Router)"
    base_url: "https://router.huggingface.co/v1"
    model: "meta-llama/Llama-3.2-11B-Vision-Instruct"
    needs_api_key: true
    api_key_env: "HF_API_KEY"
    text_models:
      - "meta-llama/Llama-3.2-11B-Vision-Instruct"
      - "Qwen/Qwen2.5-VL-7B-Instruct"
    vision_models:
      - "meta-llama/Llama-3.2-11B-Vision-Instruct"
      - "Qwen/Qwen2.5-VL-7B-Instruct"
